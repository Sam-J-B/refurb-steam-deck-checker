name: Steam Deck Stock Checker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.11'
    
      - name: Install dependencies
        run: pip install -r requirments.txt

      - name: Execute stock check
        run: python main.py
